services:
  - type: web
    name: zol-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SHOP_TEAM_NOTIFY_NUMBER
        sync: false
      - key: SHOP_NAME
        value: ZOL
      - key: SHOP_PHONE
        value: "(878) 673-0209"
      - key: SHOP_ADDRESS
        value: "1146 North Cedar Street, Beside Safeway"
      - key: SHOP_WEBSITE
        value: ""
      - key: SHOP_HOURS
        value: "Calls answered 24/7. Shop appointments available daily 8:00 AM-6:00 PM."
      - key: BASE_URL
        sync: false
