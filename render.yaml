services:
  - type: web
    name: zol-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SHOP_NAME
        value: ZOL
      - key: SHOP_PHONE
        value: "(530) 555-0199"
      - key: SHOP_ADDRESS
        value: "Chico, CA"
      - key: SHOP_WEBSITE
        value: www.zolauto.com
      - key: SHOP_HOURS
        value: "Monday-Friday 8:00 AM-6:00 PM, Saturday 9:00 AM-2:00 PM"
      - key: BASE_URL
        sync: false
